name: Deploy to Code Engine

on:
  push:
    # Trigger on push to any branch
    branches: [ '**' ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Deploy to IBM Cloud Code Engine
      uses: IBM/code-engine-github-action@v1
      with:
        api-key: ${{ secrets.IBM_CLOUD_API_KEY }}
        resource-group: 'Default'
        region: 'ca-tor'
        project: 'checkmate'
        name: 'checkmate'
        build-source: './'
        # FORCES a fresh build from your Dockerfile instead of skipping
        build-strategy: dockerfile
        cpu: 1
        memory: 4G
    
    - name: Cleanup old container images
      run: |
        # Install IBM Cloud CLI with sudo
        curl -fsSL https://clis.cloud.ibm.com/install/linux | sudo sh
        
        # Install the container-registry plugin so 'cr' commands work
        ibmcloud plugin install container-registry -r 'IBM Cloud'
        
        # Authenticate
        ibmcloud login --apikey ${{ secrets.IBM_CLOUD_API_KEY }} -r ca-tor -g Default
        
        # Login to the Container Registry
        ibmcloud cr login
        
        # Keep only the most recent image and delete all others to save space
        ibmcloud cr image-list --format '{{.Repository}}:{{.Tag}}' | \
          grep checkmate | \
          tail -n +2 | \
          xargs -I {} ibmcloud cr image-rm {} --force || true