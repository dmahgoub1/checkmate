name: Deploy to Code Engine

on:
  push:
    branches: [ '**' ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Deploy to IBM Cloud Code Engine
      uses: IBM/code-engine-github-action@v1
      with:
        api-key: ${{ secrets.IBM_CLOUD_API_KEY }}
        resource-group: 'Default'
        region: 'ca-tor'
        project: 'checkmate'
        name: 'checkmate'
        build-source: './'
        build-strategy: dockerfile
        # FORCES the image into your registry and makes it visible
        image: icr.io/checkmate-registry/checkmate:latest
        # Uses the default secret IBM creates for your registry
        registry-secret: ce-auto-icr-private-tor
        # REQUIRED: Keeps the GitHub Action open so you see the REAL logs
        wait: true
        cpu: 1
        memory: 4G
    
    - name: Cleanup old container images
      run: |
        curl -fsSL https://clis.cloud.ibm.com/install/linux | sudo sh
        ibmcloud plugin install container-registry -r 'IBM Cloud'
        ibmcloud login --apikey ${{ secrets.IBM_CLOUD_API_KEY }} -r ca-tor -g Default
        ibmcloud cr login
        # This will now find images because they are explicitly pushed to your namespace
        ibmcloud cr image-list --format '{{.Repository}}:{{.Tag}}' | \
          grep checkmate | \
          tail -n +2 | \
          xargs -I {} ibmcloud cr image-rm {} --force || true