- name: Deploy to IBM Cloud Code Engine
      uses: IBM/code-engine-github-action@v1
      with:
        api-key: ${{ secrets.IBM_CLOUD_API_KEY }}
        resource-group: 'Default'
        region: 'ca-tor'
        project: 'checkmate'
        name: 'checkmate'
        build-source: './'
        # Removed 'dockerfile' as it is an invalid input for this action
        cpu: 1
        memory: 4G
