<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkmate - Scan</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        :root { 
            --brand: #ff4b81; 
            --brand-dark: #e04372;
            --dark: #0a0a0a; 
            --card-bg: #141414;
            --border: #1f1f1f;
            --text-muted: #888;
            --input-bg: #0f0f0f;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            background: var(--dark); 
            color: #fff; 
            padding: 40px 20px;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(255, 75, 129, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 75, 129, 0.03) 0%, transparent 50%);
        }
        
        .container {
            width: 100%;
            max-width: 520px;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .logo { 
            width: 120px;
            margin-bottom: 16px;
            display: block; 
            margin-left: auto; 
            margin-right: auto;
            filter: drop-shadow(0 4px 12px rgba(255, 75, 129, 0.2));
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }
        
        .header { 
            text-align: center; 
            margin-bottom: 40px; 
        }
        
        .slogan { 
            color: var(--brand); 
            font-weight: 700; 
            font-size: 0.7rem; 
            text-transform: uppercase; 
            letter-spacing: 3px;
            margin-bottom: 12px;
            opacity: 0.9;
        }

        .header h2 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #fff;
            line-height: 1.4;
        }
        
        /* Upload Container - Enhanced but functionality preserved */
        .upload-container { 
            background: var(--card-bg);
            border: 2px dashed var(--border);
            border-radius: 20px;
            padding: 50px 30px;
            width: 100%;
            text-align: center; 
            cursor: pointer; 
            transition: all 0.3s ease;
            position: relative;
            margin-bottom: 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        
        .upload-container:hover { 
            border-color: var(--brand);
            background: #1a1a1a;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255, 75, 129, 0.15);
        }

        #upload-text {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        #upload-text::before {
            content: '📸';
            font-size: 2rem;
            display: block;
        }
        
        .preview-img { 
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 12px;
            display: none;
            margin-top: 0;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }
        
        /* Form styling - Enhanced but structure preserved */
        .form-group { 
            width: 100%;
            display: flex; 
            flex-direction: column; 
            gap: 14px;
        }
        
        input, textarea { 
            background: var(--input-bg);
            border: 1px solid var(--border);
            padding: 16px 18px;
            border-radius: 12px;
            color: #fff; 
            font-family: inherit; 
            font-size: 0.95rem;
            transition: all 0.3s ease;
            font-weight: 400;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--brand);
            background: #121212;
            box-shadow: 0 0 0 3px rgba(255, 75, 129, 0.1);
        }

        input::placeholder, textarea::placeholder {
            color: #555;
        }
        
        .date-row { 
            display: flex; 
            gap: 12px;
            margin-top: 0;
        }
        
        .date-input-group { 
            flex: 1; 
            display: flex; 
            flex-direction: column;
        }
        
        .date-label { 
            font-size: 0.7rem; 
            color: var(--text-muted);
            text-transform: uppercase; 
            margin-left: 0;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
            line-height: 1.5;
        }

        .btn-scan { 
            background: var(--brand);
            color: #fff; 
            border: none; 
            padding: 18px 32px;
            border-radius: 12px;
            font-weight: 600; 
            cursor: pointer; 
            margin-top: 10px;
            font-size: 0.95rem;
            text-transform: uppercase; 
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(255, 75, 129, 0.25);
            position: relative;
            overflow: hidden;
            font-family: inherit;
        }

        .btn-scan::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s ease;
        }

        .btn-scan:hover::before {
            left: 100%;
        }

        .btn-scan:hover {
            background: var(--brand-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(255, 75, 129, 0.35);
        }

        .btn-scan:active {
            transform: translateY(0);
        }

        .btn-scan:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Loading Overlay - Preserved functionality, enhanced visuals */
        #loading-overlay { 
            display: none;
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(10px);
            z-index: 100; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }
        
        .spinner { 
            width: 60px;
            height: 60px;
            border: 4px solid var(--border);
            border-top: 4px solid var(--brand);
            border-radius: 50%; 
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }

        #loading-overlay p {
            margin-top: 24px;
            font-weight: 500;
            font-size: 1rem;
            color: #fff;
            letter-spacing: 0.5px;
        }

        @media (max-width: 480px) {
            body { padding: 30px 16px; }
            .header h2 { font-size: 1.2rem; }
            .upload-container { padding: 40px 24px; }
            input, textarea { font-size: 0.9rem; padding: 14px 16px; }
        }

        /* Footer Styles */
        .site-footer {
            width: 100%;
            margin-top: 60px;
            padding: 40px 20px 30px;
            background: rgba(20, 20, 20, 0.5);
            border-top: 1px solid var(--border);
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .footer-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
            font-weight: 500;
        }

        .footer-link:hover {
            color: var(--brand);
        }

        .footer-divider {
            color: #333;
            font-size: 0.9rem;
        }

        .footer-contact {
            margin-bottom: 12px;
        }

        .footer-email {
            color: var(--brand);
            text-decoration: none;
            font-size: 0.85rem;
            transition: opacity 0.3s ease;
        }

        .footer-email:hover {
            opacity: 0.8;
        }

        .footer-copyright {
            color: #555;
            font-size: 0.8rem;
            font-weight: 400;
        }

        @media (max-width: 480px) {
            .footer-links {
                flex-direction: column;
                gap: 12px;
            }
            
            .footer-divider {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Checkmate" class="logo">
        <div class="header">
            <div class="slogan">Search</div>
            <h2 id="greeting">Upload a photo and provide the following details</h2>
        </div>

        <div class="upload-container" onclick="document.getElementById('file-input').click()">
            <span id="upload-text">Tap to Upload Photo</span>
            <img id="preview" class="preview-img">
            <input type="file" id="file-input" hidden accept="image/*">
        </div>

        <div class="form-group">
            <input type="text" id="subj-name" placeholder="Name">
            <input type="text" id="city" placeholder="City">
            
            <div class="date-row">
                <div class="date-input-group">
                    <span class="date-label">Dating Start Date</span>
                    <input type="date" id="start-date">
                </div>
                <div class="date-input-group">
                    <span class="date-label">Dating End Date</span>
                    <input type="date" id="end-date">
                </div>
            </div>
            
            <textarea id="details" rows="3" placeholder="Additional Details or Experience..."></textarea>
            <button id="scan-btn" class="btn-scan">Run Checkmate Scan</button>
        </div>
    </div>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <p>Analyzing Identity...</p>
    </div>

    <script>
        const userName = sessionStorage.getItem('user_name');
        if (userName) document.getElementById('greeting').innerText = `Scan for ${userName.split(' ')[0]}`;

        const fileInput = document.getElementById('file-input');
        const preview = document.getElementById('preview');
        const uploadText = document.getElementById('upload-text');
        let base64Image = "";

        fileInput.onchange = e => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                base64Image = reader.result;
                preview.src = base64Image;
                preview.style.display = "block";
                uploadText.style.display = "none";
            };
            reader.readAsDataURL(file);
        };

        document.getElementById('scan-btn').onclick = async (e) => {
            e.preventDefault();
            if (!base64Image) return alert("Please upload a photo first.");

            document.getElementById('loading-overlay').style.display = "flex";

            const payload = {
                image_data: base64Image,
                name: document.getElementById('subj-name').value,
                city: document.getElementById('city').value,
                start_date: document.getElementById('start-date').value,
                end_date: document.getElementById('end-date').value,
                review_text: document.getElementById('details').value,
                submitter_email: sessionStorage.getItem('user_email') || "anonymous"
            };

            try {
                const response = await fetch('/submit-and-check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                if (result.status === "success" || result.status === "no_face_detected") {
                    sessionStorage.setItem('lastResult', JSON.stringify(result));
                    
                    // Use a slight delay and ensure the path is absolute
                    // This gives Safari time to clear the previous POST state
                    setTimeout(() => {
                        window.location.replace('/results'); 
                    }, 100);
                } else {
                    alert("Error: " + result.message);
                    document.getElementById('loading-overlay').style.display = "none";
                }
            } catch (err) {
                alert("Upload failed. Please try again.");
                document.getElementById('loading-overlay').style.display = "none";
            }
        };
    </script>

    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-links">
                <a href="{{ url_for('terms') }}" class="footer-link">Terms of Service</a>
                <span class="footer-divider">•</span>
                            </div>
            <div class="footer-copyright">
                © 2026 CheckMate. All rights reserved.
            </div>
        </div>
    </footer>

</body>
</html>
